name: hermes-setup-check

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: bash -n bin/hermes-setup
      - name: Full happy path (project + vault)
        run: |
          set -e
          T=$(mktemp -d)
          mkdir -p "$T/profile" "$T/proj" "$T/vault"
          cd "$T"
          export HERMES_HOME="$T/hh"
          printf "%s\n%s\n%s\n%s\n" "$T/profile" "$T/proj" y "$T/vault" | bash "$GITHUB_WORKSPACE/bin/hermes-setup" > /tmp/out1.txt
          # verify every expected artifact
          for f in "$T/hh/SOUL.md" "$T/profile/SOUL.md" "$T/proj/CLAUDE.md" "$T/proj/NEXT.md" "$T/proj/knowledge/README.md" "$T/proj/watchlist.md" "$T/vault/README.md" "$T/vault/01-Projects/AGENT.md" "$T/vault/02-Knowledge/_index.md"; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          [ -d "$T/proj/daily-logs" ] || { echo "::error::missing daily-logs/"; exit 1; }
          # POSITIVE summary assertions (round 7: old greps were unfailable)
          grep -q "A global SOUL" /tmp/out1.txt || { echo "::error::summary missing 'A global SOUL' on a run that wrote it"; exit 1; }
          grep -q "EDIT the profile SOUL placeholders" /tmp/out1.txt || { echo "::error::EDIT next-step missing on a run that wrote a profile SOUL"; exit 1; }
          grep -q "Profile/project files written this run" /tmp/out1.txt || { echo "::error::authorship claim missing on a run that scaffolded"; exit 1; }
          echo "happy path OK"
      - name: Idempotency (rerun skips everything)
        run: |
          set -e
          # FRESH dir: first run must write >5 items (assert, don't assume)
          T=$(mktemp -d)
          mkdir -p "$T/profile" "$T/proj" "$T/vault"
          cd "$T"
          export HERMES_HOME="$T/hermes-home"   # isolate from earlier steps
          printf "%s\n%s\n%s\n%s\n" "$T/profile" "$T/proj" Y "$T/vault" \
            | bash "$GITHUB_WORKSPACE/bin/hermes-setup" > /tmp/first.txt
          PLUS1=$(grep -c '  + ' /tmp/first.txt || true)
          [ "$PLUS1" = "8" ] || { echo "::error::first run wrote $PLUS1 items — expected exactly 8"; cat /tmp/first.txt; exit 1; }
          GLOBALS=$(grep -c 'global SOUL.md written' /tmp/first.txt || true)
          [ "$GLOBALS" = "1" ] || { echo "::error::global SOUL written $GLOBALS times — expected 1"; exit 1; }
          # SAME dir rerun: must write exactly 0 new items
          printf "%s\n%s\n%s\n%s\n" "$T/profile" "$T/proj" Y "$T/vault" \
            | bash "$GITHUB_WORKSPACE/bin/hermes-setup" > /tmp/rerun.txt
          PLUS2=$(grep -c '  + ' /tmp/rerun.txt || true)
          [ "$PLUS2" = "0" ] || { echo "::error::rerun wrote $PLUS2 new items — not idempotent"; cat /tmp/rerun.txt; exit 1; }
          echo "idempotency OK (first run: $PLUS1 items, rerun: 0)"
      - name: Skip paths (N answers)
        run: |
          set -e
          T=$(mktemp -d); cd "$T"
          export HERMES_HOME="$T/hh"   # sandbox: never touch the runner's ~/.hermes
          printf "\nN\nN\n" | bash "$GITHUB_WORKSPACE/bin/hermes-setup" > /tmp/skip.txt
          [ ! -f "CLAUDE.md" ] || { echo "::error::skip-path wrote CLAUDE.md"; exit 1; }
          grep -q "Files that outlive the session" /tmp/skip.txt && { echo "::error::skip-path claims scaffold that wasn't written"; exit 1; } || true
          grep -q "A profile SOUL" /tmp/skip.txt && { echo "::error::skip-path claims profile that wasn't written"; exit 1; } || true
          echo "skip path OK (nothing scaffolded, honest summary)"
      - name: Existing SOUL untouched
        run: |
          set -e
          T=$(mktemp -d); cd "$T"
          export HERMES_HOME="$T/hh"; mkdir -p "$HERMES_HOME"
          echo "PRECIOUS" > "$HERMES_HOME/SOUL.md"
          printf "N\nN\n" | bash "$GITHUB_WORKSPACE/bin/hermes-setup" > /dev/null
          grep -q "PRECIOUS" "$HERMES_HOME/SOUL.md" || { echo "::error::clobbered existing SOUL"; exit 1; }
          echo "existing-file protection OK"

      - name: headroom-check smoke test
        run: |
          set -e
          T=$(mktemp -d)
          export HERMES_HOME="$T/hh"
          mkdir -p "$HERMES_HOME/profiles/demo" "$T/proj"
          # healthy setup: small SOULs → exit 0
          printf 'identity\n' > "$HERMES_HOME/SOUL.md"
          printf 'stack facts\n' > "$HERMES_HOME/profiles/demo/SOUL.md"
          cd "$T/proj"
          printf 'ctx\n' > CLAUDE.md
          bash "$GITHUB_WORKSPACE/bin/headroom-check" "$HERMES_HOME/profiles/demo" || { echo "::error::healthy setup should exit 0"; exit 1; }
          # bloated SOUL → exit 1
          python3 -c "print('x'*2000)" > "$HERMES_HOME/profiles/demo/SOUL.md"
          if bash "$GITHUB_WORKSPACE/bin/headroom-check" "$HERMES_HOME/profiles/demo" > /dev/null 2>&1; then
            echo "::error::bloated SOUL should warn (exit 1)"; exit 1
          fi
          # nothing found → exit 2 (not a congratulation) — run from a NEUTRAL cwd
          cd "$T"
          CODE=0
          HERMES_HOME=/nonexistent-hermes bash "$GITHUB_WORKSPACE/bin/headroom-check" > /dev/null 2>&1 || CODE=$?
          [ "$CODE" = "2" ] || { echo "::error::empty HERMES_HOME should exit 2, got $CODE"; exit 1; }
          cd "$T/proj"
          # profile path with spaces: measured as ONE profile
          mkdir -p "$T/hh2/profiles/my main profile"
          printf 'x' > "$T/hh2/profiles/my main profile/SOUL.md"
          python3 -c "print('y'*2000)" > "$T/hh2/SOUL.md"
          set +e
          OUT=$(HERMES_HOME="$T/hh2" bash "$GITHUB_WORKSPACE/bin/headroom-check" 2>/dev/null)
          OUTCODE=$?
          set -e
          echo "$OUT" | grep -q "my main profile/SOUL" || { echo "::error::spaced profile name not measured"; exit 1; }
          [ "$OUTCODE" = "1" ] || { echo "::error::spaces run exit $OUTCODE, want 1 (oversized global)"; exit 1; }
          # diverging CLAUDE.md vs AGENTS.md → warned
          mkdir -p "$T/div" && cd "$T/div"
          printf 'canonical A' > CLAUDE.md && printf 'different B' > AGENTS.md
          set +e
          DIVOUT=$(HERMES_HOME="$T/hh2" bash "$GITHUB_WORKSPACE/bin/headroom-check" 2>/dev/null)
          DIVCODE=$?
          set -e
          echo "$DIVOUT" | grep -q "diverging" || { echo "::error::divergence not flagged"; exit 1; }
          [ "$DIVCODE" = "1" ] || { echo "::error::divergence run exit $DIVCODE, want 1"; exit 1; }
          # 'yes' at Obsidian prompt scaffolds the vault
          V=$(mktemp -d)
          set +e
          printf "\nN\nyes\n$V\n" | bash "$GITHUB_WORKSPACE/bin/hermes-setup" > /dev/null 2>&1
          HSCODE=$?
          set -e
          [ "$HSCODE" = "0" ] || { echo "::error::hermes-setup exited $HSCODE on yes-path"; exit 1; }
          [ -f "$V/README.md" ] || { echo "::error::'yes' at Obsidian prompt did not scaffold"; exit 1; }
          echo "headroom-check OK (healthy=0, bloated=1, empty=2, spaces, divergence, yes-prompt)"

      - name: bash POSIX-mode parse (approximates macOS 3.2 strictness)
        run: |
          set -e
          bash --posix -n "$GITHUB_WORKSPACE/bin/hermes-setup"
          bash --posix -n "$GITHUB_WORKSPACE/bin/headroom-check"
          echo "posix parse OK"
      - name: Permission-path tests (unwritable dirs never abort)
        run: |
          set -e
          T=$(mktemp -d)
          # unwritable profile dir → skip, exit 0, summary present
          mkdir -p "$T/ro-prof" "$T/proj"; chmod 555 "$T/ro-prof"
          printf "%s\n%s\nN\n" "$T/ro-prof" "$T/proj" \
            | HERMES_HOME="$T/hh" bash "$GITHUB_WORKSPACE/bin/hermes-setup" > /tmp/pp.txt 2>&1
          grep -q "not writable" /tmp/pp.txt && grep -q "What you now have" /tmp/pp.txt
          chmod 755 "$T/ro-prof"
          # watchlist as dir → graceful
          mkdir -p "$T/proj2/watchlist.md"
          printf "\n%s\nN\n" "$T/proj2" \
            | HERMES_HOME="$T/hh2" bash "$GITHUB_WORKSPACE/bin/hermes-setup" > /tmp/pp2.txt 2>&1
          grep -q "not a file (directory?)" /tmp/pp2.txt
          # unwritable HERMES_HOME chain → skip, no raw line errors
          mkdir -p "$T/lock"; chmod 555 "$T/lock"
          printf "\nN\nN\n" \
            | HERMES_HOME="$T/lock/x/hermes" bash "$GITHUB_WORKSPACE/bin/hermes-setup" > /tmp/pp3.txt 2>&1
          grep -qE "cannot write .*SOUL.md|global SOUL NOT written" /tmp/pp3.txt
          if grep -qE "line [0-9]+:" /tmp/pp3.txt; then echo "::error::raw bash error leaked"; exit 1; fi
          chmod 755 "$T/lock"
          # rerun with ALL files pre-existing (writable, populated) → honest denial
          printf 'MY OWN' > "$T/ro-prof/SOUL.md"
          printf 'MY CLAUDE' > "$T/proj/CLAUDE.md"; printf 'MY NEXT' > "$T/proj/NEXT.md"
          mkdir -p "$T/proj/knowledge"; printf 'x' > "$T/proj/knowledge/README.md"
          printf 'x' > "$T/proj/watchlist.md"; mkdir -p "$T/proj/daily-logs"
          printf "%s\n%s\nN\n" "$T/ro-prof" "$T/proj" \
            | HERMES_HOME="$T/hh" bash "$GITHUB_WORKSPACE/bin/hermes-setup" > /tmp/rerun.txt 2>&1 || true
          grep -q "nothing new this run" /tmp/rerun.txt || { echo "::error::rerun with all-existing must say 'nothing new this run"; cat /tmp/rerun.txt; exit 1; }
          grep -q "MY OWN" "$T/ro-prof/SOUL.md" || { echo "::error::populated profile SOUL clobbered"; exit 1; }
          # daily-logs as FILE must not abort (type conflict)
          mkdir -p "$T/proj3" && touch "$T/proj3/daily-logs"
          printf "\n%s\nN\n" "$T/proj3" \
            | HERMES_HOME="$T/hh9" bash "$GITHUB_WORKSPACE/bin/hermes-setup" > /tmp/typeconf.txt 2>&1
          grep -q "What you now have" /tmp/typeconf.txt || { echo "::error::daily-logs-as-file aborted the installer"; exit 1; }
          # 'no' at project prompt must skip, not treat as path
          printf "\nno\nN\n" \
            | HERMES_HOME="$T/hh10" bash "$GITHUB_WORKSPACE/bin/hermes-setup" > /tmp/no.txt 2>&1
          grep -q "project scaffold" /tmp/no.txt || { echo "::error::'no' at project prompt not recognized as skip"; exit 1; }
          echo "permission paths OK"
      - name: Partial-state + ANSI tests (round 8)
        run: |
          set -e
          T=$(mktemp -d)
          # partial project: CLAUDE/NEXT exist, rest missing → summary must CLAIM
          mkdir -p "$T/part"
          printf x > "$T/part/CLAUDE.md"; printf x > "$T/part/NEXT.md"
          printf "N\n%s\nN\n" "$T/part" \
            | HERMES_HOME="$T/hp" bash "$GITHUB_WORKSPACE/bin/hermes-setup" > /tmp/part.txt 2>&1
          grep -q "files written this run" /tmp/part.txt \
            || { echo "::error::partial run denies writes it made"; exit 1; }
          # piped output carries NO raw ANSI bytes
          printf "N\n%s\nN\n" "$T/part" \
            | HERMES_HOME="$T/hp" bash "$GITHUB_WORKSPACE/bin/hermes-setup" > /tmp/ansi.txt 2>&1
          LC_ALL=C grep -q $'\x1b' /tmp/ansi.txt \
            && { echo "::error::raw ANSI in piped output"; exit 1; } || true
          echo "partial-state + ANSI OK"
      - name: Type-conflict + unreadable tests (round 9)
        run: |
          set -e
          T=$(mktemp -d)
          # CLAUDE.md as directory → typed message, zero raw errors
          mkdir -p "$T/proj/CLAUDE.md"
          printf "N\n%s\nN\n" "$T/proj" \
            | HERMES_HOME="$T/hh" bash "$GITHUB_WORKSPACE/bin/hermes-setup" > /tmp/tc.txt 2>&1
          grep -q "not a file (directory?)" /tmp/tc.txt || { echo "::error::dir-typed CLAUDE.md not typed"; exit 1; }
          if grep -qE "line [0-9]+:" /tmp/tc.txt; then echo "::error::raw bash error leaked"; exit 1; fi
          # rerun shows all skip lines (no silent skips)
          mkdir -p "$T/proj2"
          printf "N\n%s\nN\n" "$T/proj2" \
            | HERMES_HOME="$T/hh2" bash "$GITHUB_WORKSPACE/bin/hermes-setup" > /dev/null 2>&1
          SKIPS=$(printf "N\n%s\nN\n" "$T/proj2" \
            | HERMES_HOME="$T/hh2" bash "$GITHUB_WORKSPACE/bin/hermes-setup" 2>/dev/null | grep -c "↷" || true)
          [ "$SKIPS" -ge 6 ] || { echo "::error::rerun shows only $SKIPS skips (want >=6)"; exit 1; }
          # chmod 000 tier-3 file → UNREADABLE + exit 1
          mkdir -p "$T/hh3/proj" && cd "$T/proj" 2>/dev/null || cd "$T"
          mkdir -p "$T/ur" && cd "$T/ur" && printf x > CLAUDE.md && chmod 000 CLAUDE.md
          CODE=0
          HERMES_HOME="$T/hh3" bash "$GITHUB_WORKSPACE/bin/headroom-check" > /tmp/ur.txt 2>/dev/null || CODE=$?
          [ "$CODE" = "1" ] || { echo "::error::unreadable CLAUDE.md exit $CODE (want 1)"; exit 1; }
          grep -q "UNREADABLE" /tmp/ur.txt || { echo "::error::unreadable not flagged"; exit 1; }
          echo "type-conflict + unreadable OK"
      - name: Subdir type-conflict + FOUND + template-guard tests (round 10)
        run: |
          set -e
          T=$(mktemp -d)
          # subdir files as directories → typed messages, no raw errors
          mkdir -p "$T/proj/daily-logs/$(date +%F).md" "$T/proj/knowledge/README.md"
          printf "N\n%s\nN\n" "$T/proj" \
            | HERMES_HOME="$T/hh" bash "$GITHUB_WORKSPACE/bin/hermes-setup" > /tmp/sub.txt 2>&1
          grep -q "not a file (directory?)" /tmp/sub.txt || { echo "::error::subdir type-conflict not typed"; exit 1; }
          if grep -qE "line [0-9]+:" /tmp/sub.txt; then echo "::error::raw bash error leaked"; exit 1; fi
          # memory-only setup → exit 1 (warned), not 2 (nothing found)
          mkdir -p "$T/hh2/memories"
          python3 -c "print('y'*6000)" > "$T/hh2/memories/MEMORY.md"
          CODE=0
          (cd "$T" && HERMES_HOME="$T/hh2" bash "$GITHUB_WORKSPACE/bin/headroom-check" > /dev/null 2>&1) || CODE=$?
          [ "$CODE" = "1" ] || { echo "::error::memory-only setup exit $CODE (want 1)"; exit 1; }
          # template removed → no 0-byte target created
          mv "$GITHUB_WORKSPACE/templates/soul-global.md" /tmp/sg.bak
          printf "N\nN\nN\n" | HERMES_HOME="$T/hh3" bash "$GITHUB_WORKSPACE/bin/hermes-setup" > /dev/null 2>&1 || true
          mv /tmp/sg.bak "$GITHUB_WORKSPACE/templates/soul-global.md"
          [ ! -e "$T/hh3/SOUL.md" ] || { echo "::error::0-byte target created on template failure"; exit 1; }
          echo "round-10 suites OK"
